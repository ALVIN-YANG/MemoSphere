[project]
name = "memosphere"
version = "0.3.0"
description = "Memory Sphere 个人记忆控制台与桌面 Agent 接入组件"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]==2.3.0",
    "numpy>=2,<3",
    "onnxruntime>=1.22,<2",
    "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
tracing = [
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6,<2",
]
